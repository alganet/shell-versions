name: Verify build checksums
description: Extracts /opt from the built image and verifies binaries against committed checksums in checksums/build/
runs:
  using: composite
  steps:
    - name: Extract image /opt
      shell: bash
      run: |
        set -ex
        container=$(docker create "${{ inputs.image }}")
        docker cp $container:/opt ./image_out
        docker rm $container

    - name: Verify build checksums
      shell: bash
      env:
        SHVR_ARCH: ${{ inputs.arch }}
        SHVR_DIR_OUT: ${{ github.workspace }}/image_out
        SHVR_CHECKSUMS_DIR: ${{ github.workspace }}/checksums
      run: |
        set -ex
        # Annotate on failure: shvr_verify_build_checksums already reports every
        # mismatch with expected/actual, but only to stderr -- so on a 640-job run
        # the run page showed a red X and nothing else. The details stay in the
        # log; this puts the target and arch where a reader will actually see it.
        if ! sh shvr.sh verify_build_checksums ${{ inputs.targets }}; then
          echo "::error::build checksum verification failed for arch=${{ inputs.arch }} targets='${{ inputs.targets }}' (image ${{ inputs.image }}); see the log above for per-binary expected/actual"
          exit 1
        fi

inputs:
  image:
    description: Docker image tag to verify (required)
    required: true
  arch:
    description: Build architecture (amd64|arm64) selecting checksums/build/<arch>/
    required: false
    default: amd64
  targets:
    description: Space-separated list of targets to verify (optional, verifies all if omitted)
    required: false
    default: ''
