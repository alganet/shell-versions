name: Build and push with retry
description: docker/build-push-action with one automatic retry for transient buildx/registry failures
inputs:
  context:
    description: 'Build context'
    required: false
    default: '.'
  file:
    description: 'Dockerfile path'
    required: false
    default: ''
  target:
    description: 'Build stage target'
    required: false
    default: ''
  platforms:
    description: 'Target platform(s), e.g. linux/arm64; empty uses the builder default'
    required: false
    default: ''
  push:
    description: 'Push the image'
    required: false
    default: 'true'
  tags:
    description: 'Image tags'
    required: true
  build-args:
    description: 'Build args'
    required: false
    default: ''
  build-contexts:
    description: 'Named build contexts, e.g. toolchain=docker-image://ghcr.io/...; overrides the same-named Dockerfile stage'
    required: false
    default: ''
  cache-from:
    description: 'Cache sources'
    required: false
    default: ''
  cache-to:
    description: 'Cache export'
    required: false
    default: ''
  labels:
    description: 'Image labels (config-level); empty adds none'
    required: false
    default: ''
  annotations:
    description: 'OCI annotations (manifest-level); empty adds none'
    required: false
    default: ''
  provenance:
    description: 'Provenance attestation (true|false|mode=...); empty uses the action default'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Build and push (attempt 1)
      id: attempt1
      continue-on-error: true
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        build-contexts: ${{ inputs.build-contexts }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        labels: ${{ inputs.labels }}
        annotations: ${{ inputs.annotations }}
        provenance: ${{ inputs.provenance }}
    # Wait before retrying. This used to retry INSTANTLY, which is the one thing
    # that cannot help against the failure it exists to absorb: a rate-limited or
    # briefly-unavailable upstream gets hit twice within seconds and fails twice.
    # The toolchain failure that prompted this had two identical annotations 90
    # seconds apart for exactly that reason.
    #
    # The warning matters too -- attempt 1's failure is only a soft annotation, so
    # a build that succeeded on the second try was previously indistinguishable
    # from one that succeeded outright, and flakiness stayed invisible.
    - name: Back off before retry
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::build-push: attempt 1 failed for '${{ inputs.tags }}'; retrying after backoff"
        sleep 45
    - name: Build and push (retry)
      if: steps.attempt1.outcome == 'failure'
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        build-contexts: ${{ inputs.build-contexts }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        labels: ${{ inputs.labels }}
        annotations: ${{ inputs.annotations }}
        provenance: ${{ inputs.provenance }}
