name: Toolchain downloads
description: Downloads and caches musl-cross-make and rustup
runs:
  using: composite
  steps:
    - name: Restore toolchain download cache
      uses: actions/cache/restore@v5
      id: restore-toolchain
      with:
        path: |
          build/musl-cross-make-*
          build/rustup-init-*
        key: build-toolchain-${{ hashFiles('common/musl-cross-make.sh', 'common/rustup.sh') }}
        # See the note in common-downloads: exact-match-only meant a comment edit
        # to musl-cross-make.sh discarded these tarballs and re-fetched cold.
        # Filenames embed their commit/version, so an older entry can never
        # satisfy a bumped pin.
        restore-keys: |
          build-toolchain-
    - name: Download toolchain dependencies
      shell: sh
      run: sh .github/retry.sh 3 30 sh shvr.sh toolchain-download
    - uses: actions/cache/save@v5
      if: steps.restore-toolchain.outputs.cache-hit != 'true'
      with:
        path: |
          build/musl-cross-make-*
          build/rustup-init-*
        key: build-toolchain-${{ hashFiles('common/musl-cross-make.sh', 'common/rustup.sh') }}
