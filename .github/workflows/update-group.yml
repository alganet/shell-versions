# Reusable: build one SOURCE-GROUP's new versions for both arches and open/update
# a single PR for it. Called once per changed group by update-prs.yml. A group is
# a source (shvr_group_of): busybox = ash+hush share one tree and one PR; every
# other shell is its own group. One call -> one durable PR on branch update-<group>.
name: Update a source-group

on:
  workflow_call:
    inputs:
      group:
        description: "Source-group key (e.g. busybox, dash) — names the branch update-<group>"
        required: true
        type: string
      shells:
        description: "Space-separated shells in this group to build (e.g. \"ash hush\")"
        required: true
        type: string
      versions_artifact:
        description: "Artifact holding the planned versions/ tree (uploaded by the plan job)"
        required: true
        type: string
      dry_run:
        description: "Build and diff, but do not push a branch or open a PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read
  pull-requests: write

# One in-flight run per group: two overlapping runs would race the shared
# update-<group> branch. Newer wins; the older is cancelled before it pushes.
concurrency:
  group: update-group-${{ inputs.group }}
  cancel-in-progress: true

jobs:
  # Build the group's new versions natively per arch and hand its regenerated
  # checksums (+ the group's versions files) up as an artifact. Native runners so
  # arm64 is not emulated, matching docker.yml.
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      # Overlay ONLY this group's version files. They are named by source
      # (versions/<group>.*; ash/hush carry none of their own — they read
      # busybox's), so restoring just these means build_updated's global prune
      # drops only THIS group's removed versions and never another group's,
      # keeping the PR scoped. The rest of versions/ stays at main's state.
      - name: Restore this group's planned versions
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.versions_artifact }}
          path: planned-versions
      - name: Overlay versions/${{ inputs.group }}.*
        run: |
          set -eu
          cp -a "planned-versions/${{ inputs.group }}".* versions/
          rm -rf planned-versions
          echo "versions/${{ inputs.group }}.* after overlay:" >&2
          ls -1 "versions/${{ inputs.group }}".* >&2

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      # build_updated fetches this group's new sources (skip-verify) + mints their
      # SOURCE checksums, then builds the arch's missing targets and writes its
      # BUILD checksums, then prunes the group's dropped versions. SHVR_BUILD_ARCHES
      # pins it to this runner's arch.
      #
      # SHVR_BUILD_CONTEXTS replaces the Dockerfile's toolchain stage with the
      # image the toolchain job published for this run, so musl-cross-make is
      # consumed, not recompiled -- the same build-context contract as
      # build-images.yml, and the fix for build jobs that used to spend ~15 min
      # re-deriving the toolchain from source. github.run_id here is the caller's
      # run id (reusable workflows share it), so this resolves to the exact image
      # the toolchain job pushed.
      - name: Build updated versions and regenerate checksums (${{ matrix.arch }})
        env:
          SHVR_BUILD_ARCHES: ${{ matrix.arch }}
          SHVR_BUILD_CONTEXTS: toolchain=docker-image://ghcr.io/${{ github.repository }}:run-${{ github.run_id }}-toolchain-${{ matrix.arch }}
          # Via env, never interpolated into the command text: build_updated takes
          # a word-split shell list, so SHELLS is expanded unquoted (SC2086), but
          # a ${{ }} splice into `run:` would be a script-injection surface. Same
          # safe pattern the plan job uses (update-prs.yml).
          SHELLS: ${{ inputs.shells }}
        # shellcheck disable=SC2086
        run: sh shvr.sh build_updated $SHELLS

      # Hand up exactly what this group changed: its versions files, its source
      # checksums, and this arch's build checksums. The collate job fuses the two
      # arches. A build that produced nothing is caught by the build step's
      # non-zero exit above, not here: versions/ and checksums/sources always
      # exist, so if-no-files-found stays a cheap backstop for a mis-typed path,
      # not a build-empty detector.
      - name: Upload this group's changes (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: update-${{ inputs.group }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            versions/${{ inputs.group }}.*
            checksums/sources
            checksums/build/${{ matrix.arch }}

  # Fuse both arches' checksums, commit, and open/refresh one PR for the group.
  collate-and-pr:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 (full history) is required by the PR step below: it pushes
      # the branch with --force-with-lease, which needs the remote-tracking refs a
      # shallow (default depth-1) checkout lacks. Without it the push exits 1
      # immediately -- the "git failed exit code 1" the first run hit even with a
      # correctly-scoped token.
      #
      # The token is persisted as the origin credential and reused for the push,
      # so branch updates come from the SAME identity that opens the PR. That
      # matters: a push authenticated with the default GITHUB_TOKEN cannot trigger
      # the PR's `synchronize` CI run, so the refresh below would silently stop
      # re-running CI on an existing PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPDATE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      # Both arch artifacts unpack onto the clean checkout. versions/ and
      # checksums/sources are identical across arches (arch-neutral); each arch
      # contributes its own checksums/build/<arch>. Later extraction wins on the
      # shared paths, which is a no-op since they match.
      - uses: actions/download-artifact@v8
        with:
          name: update-${{ inputs.group }}-amd64
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: update-${{ inputs.group }}-arm64
          path: .

      # Artifacts overlay ADDITIVELY — they add the new version's files but cannot
      # express a deletion. A version this bump DROPS (e.g. dash 0.5.13.4 -> .5)
      # still has its build-checksum dirs in the checked-out main tree. prune
      # removes exactly those: it keeps the buildset, and only this group's
      # versions are overlaid, so only this group's dropped versions are reaped —
      # other groups stay at main's state and are untouched. (Source checksums are
      # not pruned by design, matching the rest of the repo.)
      - name: Prune dropped versions' build checksums
        run: sh shvr.sh prune_build_checksums

      # Stage the group's changes and turn them into the PR body. The body is
      # generated rather than static so a reader sees WHICH versions moved without
      # opening the diff: one bullet per changed versions/ file, listing the
      # version tokens this run added and removed.
      #
      # Group/shells come in via env, never spliced into the script text: every
      # ${{ }} in a `run:` is a script-injection surface, and this is the same safe
      # pattern the build and plan steps use.
      - name: Stage the group's changes and summarize them
        env:
          GROUP: ${{ inputs.group }}
          SHELLS: ${{ inputs.shells }}
        run: |
          set -eu

          git add -A versions checksums
          git --no-pager diff --cached --stat

          if git diff --cached --quiet
          then
            echo "No changes for group ${GROUP} — nothing to PR." >&2
            echo "changed=no" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "changed=yes" >> "$GITHUB_ENV"

          # One file's staged diff -> the sentence for its bullet. Field 1 is the
          # version token in every versions/ file shape (".all" carries a date in
          # field 2, ".snapshot" the full sha), so that is what gets reported.
          #
          # NET change, not raw diff sides: a token on both sides only had a later
          # field move (a date correction upstream, say) and is not a version
          # change at all, so it cancels out and the bullet reads "changed". The
          # +++/--- deletes drop the diff's file headers, which would otherwise
          # read as bogus tokens.
          version_delta () {
            awk '
              /^(\+\+\+|---)/ { next }
              /^\+/ { sub(/^\+/, ""); if (!($1 in add)) { add[$1] = 1; addv[++na] = $1 }; next }
              /^-/  { sub(/^-/,  ""); if (!($1 in del)) { del[$1] = 1; delv[++nd] = $1 }; next }
              function join(v, n, other,   i, out, sep) {
                out = ""; sep = ""
                for (i = 1; i <= n; i++) {
                  if (!(v[i] in other)) { out = out sep "`" v[i] "`"; sep = ", " }
                }
                return out
              }
              END {
                a = join(addv, na, del)
                d = join(delv, nd, add)
                if (a != "" && d != "") { print "added " a "; removed " d }
                else if (a != "")       { print "added " a }
                else if (d != "")       { print "removed " d }
                else                    { print "changed" }
              }
            '
          }

          # -U0 so only changed lines reach version_delta.
          versions_md="${RUNNER_TEMP}/versions.md"
          : > "$versions_md"
          for f in $(git diff --cached --name-only -- versions)
          do
            printf -- '- `%s`: %s\n' \
              "$(basename "$f")" \
              "$(git diff --cached -U0 -- "$f" | version_delta)" >> "$versions_md"
          done

          n_sources="$(git diff --cached --name-only -- checksums/sources | wc -l)"
          n_build="$(git diff --cached --name-only -- checksums/build | wc -l)"

          # Written to RUNNER_TEMP (stable across steps in a job), never into the
          # work tree: `git add -A versions checksums` above has already staged
          # everything this PR commits, and a stray file at the repo root would
          # show up as untracked noise in the branch.
          body="${RUNNER_TEMP}/pr-body.md"
          {
            printf 'Automated version bump for the **%s** source-group (shells: `%s`), opened by the `update-prs` workflow.\n\n' "$GROUP" "$SHELLS"
            printf '### Versions\n\n'
            cat "$versions_md"
            printf '\n### Checksums\n\n'
            printf -- '- %s source checksum file(s) regenerated\n' "$n_sources"
            printf -- '- %s build checksum file(s) regenerated (amd64 + arm64)\n' "$n_build"
            printf '\n'
            printf 'New versions carry no committed build checksums, and the assemble job fails closed on that — so the bump and its checksums land together, in one PR.\n\n'
            printf -- '---\n\n'
            printf 'Last refreshed by [run %s](%s/%s/actions/runs/%s), started by @%s on %s.\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
              "$GITHUB_ACTOR" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf 'The commit is re-dated on every run, so its date is when this PR was last verified against upstream — not when the bump was first found.\n\n'
            printf 'If CI did not start automatically, this PR was created with the default token; re-run it by hand or configure `UPDATE_PR_TOKEN`.\n'
          } > "$body"

          # Same text in the run summary, so a dry-run shows the body a real run
          # would post without any PR existing.
          {
            printf '### PR body for `%s`\n\n' "$GROUP"
            cat "$body"
          } >> "$GITHUB_STEP_SUMMARY"

      # dry-run stops here: the staged diff above is the artifact to inspect, and
      # the tree is uploaded so a reviewer can see exactly what a real run would
      # commit — without a branch or PR existing.
      - name: Upload proposed changes (dry-run)
        if: ${{ inputs.dry_run && env.changed == 'yes' }}
        uses: actions/upload-artifact@v7
        with:
          name: proposed-${{ inputs.group }}
          path: |
            versions/${{ inputs.group }}.*
            checksums

      # Real run: one durable PR per group. Stable branch update-<group> means a
      # re-run refreshes the same PR instead of opening a new one (no spam).
      #
      # FLAT name (update-<group>, not update/<group>) on purpose. Git stores refs
      # as paths, so a hierarchical update/<group> needs refs/heads/update/ to be a
      # DIRECTORY -- and the instant any single-segment ref named `update` exists
      # on the remote, every update/<group> push is "remote rejected ... (directory
      # file conflict)". A flat name has no `/`, so it can never collide with a
      # sibling ref or with an `update` branch; the auto-PR push always succeeds.
      #
      # NOTE: a PR opened with the default GITHUB_TOKEN does NOT trigger the
      # pull_request build (docker.yml) — GitHub blocks token-created events from
      # cascading. Set repo secret UPDATE_PR_TOKEN to a PAT to have the update PR
      # run CI automatically; otherwise re-run CI once by hand (e.g. close/reopen).
      #
      # Plain git + gh rather than create-pull-request, because of the refresh
      # contract: the branch is ALWAYS re-committed and re-pushed, even when the
      # tree is byte-identical to what the PR already carries. That keeps the
      # commit date equal to the last time this workflow verified the group
      # against upstream — create-pull-request compares content and skips the push
      # when it matches, leaving a PR that reads as stale (and never re-runs CI)
      # however recently it was actually checked.
      - name: Create or refresh the group PR
        if: ${{ !inputs.dry_run && env.changed == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          GROUP: ${{ inputs.group }}
        run: |
          set -eu
          branch="update-${GROUP}"
          title="update: ${GROUP} new version(s)"
          body="${RUNNER_TEMP}/pr-body.md"

          # Author is whoever started this run; committer is the bot that actually
          # made and pushed the commit. Git models exactly this split, so use it
          # rather than claiming the person ran the push: GitHub renders it as
          # "<actor> authored, github-actions[bot] committed".
          #
          # GITHUB_ACTOR / GITHUB_ACTOR_ID are default runner env vars, so no
          # workflow-expression splice is needed here (and no injection surface is
          # opened), and in a reusable workflow they carry the CALLER's actor — the
          # human who dispatched update-prs, or on a cron the account the schedule
          # runs as. The <id>+<login>@users.noreply.github.com form is what GitHub
          # maps back to an account, so the commit is attributed (avatar,
          # contribution graph) even when the actor keeps their address private.
          #
          # This is the commit author only. The PR's *opener* is a property of the
          # credential that calls the API — UPDATE_PR_TOKEN's owner, else
          # github-actions[bot] — and cannot be set to a third party.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          author="${GITHUB_ACTOR} <${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com>"

          # The branch is always exactly "main's tip + one commit": the changes are
          # staged on top of the checked-out main, so committing here and force
          # -pushing HEAD replaces whatever the branch held. That is the amend —
          # the old single commit is discarded rather than added to, so the branch
          # never accumulates a chain of no-op bumps, and its one commit is dated
          # now.
          git commit --quiet -m "$title" --author="$author"

          # --force-with-lease needs the remote's current tip, so fetch it first
          # (|| true: the branch legitimately does not exist on the first run).
          # The lease is what makes the force safe — a push racing another writer
          # is rejected instead of clobbering it.
          git fetch --quiet origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          if remote_tip="$(git rev-parse --quiet --verify "refs/remotes/origin/${branch}")"
          then git push --force-with-lease="refs/heads/${branch}:${remote_tip}" origin "HEAD:refs/heads/${branch}"
          else git push origin "HEAD:refs/heads/${branch}"
          fi

          # One durable PR per group on the stable branch: refresh the open one if
          # it is there, else open it. Body and title are rewritten every run so
          # the summary always describes the commit the branch currently carries.
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if test -n "$pr"
          then
            gh pr edit "$pr" --title "$title" --body-file "$body"
            echo "refreshed PR #${pr} (branch ${branch})" >&2
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$body"
          fi
